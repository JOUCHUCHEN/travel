    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
        }
        /* 自定義捲軸 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        /* Leaflet 彈出視窗樣式覆寫 */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .leaflet-popup-content {
            margin: 16px;
            font-family: 'Noto Sans TC', sans-serif;
        }
        /* 自定義 Marker 樣式 */
        .custom-div-icon {
            background: transparent;
            border: none;
        }
        .marker-pin {
            width: 36px;
            height: 36px;
            border-radius: 50% 50% 50% 0;
            background: #3b82f6;
            position: absolute;
            transform: rotate(-45deg);
            left: 50%;
            top: 50%;
            margin: -18px 0 0 -18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }
        .marker-pin::after {
            content: '';
            width: 28px;
            height: 28px;
            margin: 4px 0 0 4px;
            background: #fff;
            position: absolute;
            border-radius: 50%;
        }
        .custom-div-icon i {
            position: absolute;
            width: 22px;
            font-size: 14px;
            left: 0;
            right: 0;
            margin: 10px auto;
            text-align: center;
            z-index: 10;
            color: #1e293b;
        }

        .day3-bg { background-color: #10b981; } /* Green */
        .day4-bg { background-color: #8b5cf6; } /* Purple */
        .info-bg { background-color: #f59e0b; } /* Yellow (Hotel/Airport) */

        .marker-day2 { background: #ef4444; }
        .marker-day3 { background: #10b981; }
        .marker-day4 { background: #8b5cf6; }
        .marker-info { background: #f59e0b; }

            opacity: 0.4;
            background-color: #f8fafc;
        }
        
        .sortable-drag {
            cursor: grabbing !important;
        }
        
        .drop-zone-active {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

            { id: 'd4-4-1', name: '松島雲端步道 (纜車為建議項目)', lat: 35.0762, lng: 129.0229, day: 4, type: 'attraction', icon: 'fa-shoe-prints', colorClass: 'marker-day4', desc: '雲端步道平坦無階梯，極度適合長輩散步！走完後可視體力決定是否搭乘纜車。', address: '171 Songdohaebyeon-ro, Seo-gu, Busan, 南韓' },
            { id: 'd4-5', name: '樂天百貨光復店', lat: 35.0988, lng: 129.0366, day: 4, type: 'shopping', icon: 'fa-bag-shopping', colorClass: 'marker-day4', desc: '頂樓觀景台賞景，地下超市大採購伴手禮，準備前往機場！', address: '2 Jungang-daero, Jung-gu, Busan, 南韓' }
        ];

        let map;
        let markers = {};
        let currentDayFilter = 0;
        let sortableList = null;
        let capsuleRouteLayer = null;
        
        const capsuleRouteCoords = [
            [35.1610, 129.1924],
            [35.1598, 129.1895],
            [35.1585, 129.1864],
            [35.1580, 129.1824],
            [35.1585, 129.1783],
            [35.1595, 129.1755]
        ];

        function initMap() {
            map = L.map('map', {
                zoomControl: false
            }).setView([35.1379, 129.0556], 12);

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> contributors',
                maxZoom: 19
            }).addTo(map);

            updateAllMarkers();
            renderList();
            initTabDropZones();
        }
        
        function updateAllMarkers() {
            for (let id in markers) {
                map.removeLayer(markers[id]);
            }
            markers = {};
            
            locations.forEach(loc => {
                loc.colorClass = loc.day === 0 ? 'marker-info' : `marker-day${loc.day}`;
                
                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="marker-pin ${loc.colorClass}"></div><i class="fa-solid ${loc.icon}"></i>`,
                    iconSize: [30, 42],
                    iconAnchor: [15, 42],
                    popupAnchor: [0, -35]
                });

                const popupContent = `
                    <div class="w-48 sm:w-56">
                        <div class="text-xs font-bold text-slate-500 mb-1">
                            ${loc.day === 0 ? '住宿/交通' : `Day ${loc.day}`}
                        </div>
                        <h3 class="text-base font-bold text-slate-800 mb-1 leading-tight">${loc.name}</h3>
                        ${loc.address ? `<div class="text-[10px] text-slate-500 mb-2 flex items-start gap-1"><i class="fa-solid fa-location-dot mt-0.5 text-slate-400"></i><span>${loc.address}</span></div>` : ''}
                        <p class="text-sm text-slate-600 mb-2">${loc.desc}</p>
                    </div>
                `;

                const marker = L.marker([loc.lat, loc.lng], { icon: customIcon })
                    .bindPopup(popupContent);
                
                markers[loc.id] = marker;
            });
            
            updateMapBounds();
        }

        function getDayColor(day) {
            switch(day) {
                case 1: return 'text-blue-600 bg-blue-100';
                case 2: return 'text-red-600 bg-red-100';
                case 3: return 'text-emerald-600 bg-emerald-100';
                case 4: return 'text-purple-600 bg-purple-100';
                default: return 'text-amber-600 bg-amber-100';
            }
        }

        function getBorderColor(day) {
            switch(day) {
                case 1: return 'border-blue-200 hover:border-blue-400';
                case 2: return 'border-red-200 hover:border-red-400';
                case 3: return 'border-emerald-200 hover:border-emerald-400';
                case 4: return 'border-purple-200 hover:border-purple-400';
                default: return 'border-amber-200 hover:border-amber-400';
            }
        }

        function renderList() {
            const listContainer = document.getElementById('location-list');
            listContainer.innerHTML = '';

            const filteredLocations = locations.filter(loc => 
                currentDayFilter === 0 || loc.day === currentDayFilter
            );

            filteredLocations.forEach(loc => {
                const dayBadge = loc.day === 0 ? '資訊' : `D${loc.day}`;
                const card = document.createElement('div');
                card.className = `p-3 bg-white border ${getBorderColor(loc.day)} rounded-xl transition-shadow hover:shadow-md flex items-stretch group sortable-item select-none cursor-grab active:cursor-grabbing`;
                card.setAttribute('data-id', loc.id);

                card.innerHTML = `
                    <div class="flex items-center justify-center pr-2 text-slate-300 group-hover:text-slate-500 transition-colors shrink-0">
                        <i class="fa-solid fa-grip-vertical text-lg"></i>
                    </div>
                    <div class="flex-1 flex items-start">
                        <div class="mt-1 mr-3 w-10 h-10 rounded-full flex items-center justify-center shrink-0 ${loc.day === 0 ? 'bg-amber-100 text-amber-600' : 
                            loc.day === 1 ? 'bg-blue-100 text-blue-600' :
                            loc.day === 2 ? 'bg-red-100 text-red-600' :
                            loc.day === 3 ? 'bg-emerald-100 text-emerald-600' : 'bg-purple-100 text-purple-600'}">
                            <i class="fa-solid ${loc.icon} text-lg"></i>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${getDayColor(loc.day)}">${dayBadge}</span>
                                <h3 class="font-bold text-sm text-slate-800 group-hover:text-blue-600 transition-colors">${loc.name}</h3>
                            </div>
                            ${loc.address ? `<div class="text-[10px] text-slate-400 mb-1.5 flex items-start gap-1"><i class="fa-solid fa-map-pin mt-0.5"></i> <span class="leading-tight">${loc.address}</span></div>` : ''}
                            <p class="text-xs text-slate-500 leading-relaxed pointer-events-none">${loc.desc}</p>
                        </div>
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    focusLocation(loc.id);
                });
                
                listContainer.appendChild(card);
            });

            initSortable();
        }

        function initSortable() {
            const el = document.getElementById('location-list');
            
            if (sortableList) {
                sortableList.destroy();
            }
            
            if (el.children.length === 0) return;
            
            sortableList = Sortable.create(el, {
                group: 'shared',
                animation: 150,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                forceFallback: true,
                fallbackClass: "sortable-fallback", 
                onEnd: function (evt) {
                    if (evt.to !== evt.from) return;

                    const currentIds = Array.from(el.children).map(child => child.getAttribute('data-id'));
                    const reorderedLocations = [];
                    let displayIdx = 0;
                    
                    for (let i = 0; i < locations.length; i++) {
                        if (currentIds.includes(locations[i].id)) {
                            const targetId = currentIds[displayIdx];
                            reorderedLocations.push(locations.find(l => l.id === targetId));
                            displayIdx++;
                        } else {
                            reorderedLocations.push(locations[i]);
                        }
                    }
                    
                    locations.splice(0, locations.length, ...reorderedLocations);
                }
            });
        }
        
        let tabSortables = [];
        
        function initTabDropZones() {
            tabSortables.forEach(s => s.destroy());
            tabSortables = [];

            document.querySelectorAll('.drop-target').forEach(target => {
                const sortable = Sortable.create(target, {
                    group: {
                        name: 'shared',
                        put: true,
                        pull: false
                    },
                    ghostClass: 'drop-zone-active',
                    onAdd: function (evt) {
                        const draggedItemId = evt.item.getAttribute('data-id');
                        const targetDay = parseInt(target.getAttribute('data-day'));
                        
                        evt.item.remove();
                        
                        const locIndex = locations.findIndex(l => l.id === draggedItemId);
                        if(locIndex !== -1 && locations[locIndex].day !== 0) {
                            locations[locIndex].day = targetDay;
                            const movedItem = locations.splice(locIndex, 1)[0];
                            locations.push(movedItem);
                            filterDay(targetDay);
                        }
                    }
                });
                tabSortables.push(sortable);
            });
        }

        function focusLocation(id) {
            const loc = locations.find(l => l.id === id);
            if (loc && map && markers[id]) {
                map.flyTo([loc.lat, loc.lng], 15, {
                    duration: 1.5
                });
                
                setTimeout(() => {
                    markers[id].openPopup();
                }, 1500);
            }
        }

        function filterDay(day) {
            currentDayFilter = day;
            
            document.querySelectorAll('.tab-btn').forEach((btn) => {
                const btnDay = btn.id === 'tab-0' ? 0 : parseInt(btn.closest('.drop-target')?.getAttribute('data-day') || 0);
                
                if (btnDay === day || (btn.id==='tab-0' && day===0)) {
                    btn.classList.add('border-slate-900', 'text-slate-900');
                    btn.classList.remove('border-transparent', 'text-slate-500');
                } else {
                    btn.classList.remove('border-slate-900', 'text-slate-900');
                    btn.classList.add('border-transparent', 'text-slate-500');
                }
            });

            renderList();
            
            const listContainer = document.getElementById('location-list');
            if (listContainer) {
                listContainer.scrollTop = 0;
            }

            updateMapBounds();
        }
        
        function updateMapBounds() {
            const bounds = [];
            locations.forEach(loc => {
                if (currentDayFilter === 0 || loc.day === currentDayFilter || loc.day === 0) {
                    bounds.push([loc.lat, loc.lng]);
                    markers[loc.id].addTo(map);
                } else {
                    map.removeLayer(markers[loc.id]);
                }
            });

            const capsuleLoc = locations.find(l => l.name.includes('列車') || l.name.includes('天空艙'));
            const capsuleDay = capsuleLoc ? capsuleLoc.day : 3;

            if (currentDayFilter === 0 || currentDayFilter === capsuleDay) {
                if (!capsuleRouteLayer) {
                    capsuleRouteLayer = L.polyline(capsuleRouteCoords, {
                        color: '#f43f5e',
                        weight: 6,
                        dashArray: '12, 10',
                        opacity: 0.9,
                        lineJoin: 'round'
                    }).bindTooltip("🛤️ 海雲台海岸列車路線 (青沙浦 ➔ 尾浦)", {sticky: true});
                }
                if (!map.hasLayer(capsuleRouteLayer)) {
                    capsuleRouteLayer.addTo(map);
                }
                
                if (currentDayFilter === capsuleDay) {
                    capsuleRouteCoords.forEach(coord => bounds.push(coord));
                }
            } else {
                if (capsuleRouteLayer && map.hasLayer(capsuleRouteLayer)) {
                    map.removeLayer(capsuleRouteLayer);
                }
            }

            if (bounds.length > 0 && map) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        function exportToPDF() {
            const btn = document.getElementById('export-btn');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> 處理中...';
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            // 直接將 HTML 字串傳給 html2pdf，不再加入 DOM 中。徹底解決白畫面與手機寬度截斷問題
            const pdfContent = `
                <div style="font-family: 'Noto Sans TC', sans-serif; padding: 20px; color: #1e293b; background: white; width: 100%;">
                    <div style="text-align: center; margin-bottom: 20px;">
                        <h1 style="font-size: 24px; font-weight: bold; margin-bottom: 8px;">釜山四天三夜遊 行程表</h1>
                        <p style="color: #64748b; font-size: 14px; margin: 0;">8/12(三) - 8/15(六)</p>
                    </div>
                    <table style="width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; margin: 0 auto;">
                        <thead>
                            <tr style="background-color: #f1f5f9;">
                                <th style="border: 1px solid #cbd5e1; padding: 10px; text-align: center; width: 12%;">順序</th>
                                <th style="border: 1px solid #cbd5e1; padding: 10px; text-align: left; width: 35%;">景點 / 行程名稱</th>
                                <th style="border: 1px solid #cbd5e1; padding: 10px; text-align: left; width: 53%;">詳細資訊 & 地址</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${generateTableRows()}
                        </tbody>
                    </table>
                </div>
            `;

            const opt = {
                margin:       10,
                filename:     '釜山四天三夜行程表.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: false }, 
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: 'css', avoid: 'tr' }
            };

            html2pdf().set(opt).from(pdfContent).save().then(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }).catch(err => {
                console.error('PDF匯出失敗', err);
                btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1"></i> 匯出失敗';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    btn.classList.remove('opacity-75', 'cursor-not-allowed');
                }, 3000);
            });
        }

        function generateTableRows() {
            let rows = '';
            // 將住宿交通(0)改到最前面
            const daysToRender = [0, 1, 2, 3, 4];
            const dayNames = {
                1: 'Day 1 行程', 
                2: 'Day 2 行程', 
                3: 'Day 3 行程', 
                4: 'Day 4 行程', 
                0: '住宿與交通資訊'
            };

            daysToRender.forEach(day => {
                const dayLocs = locations.filter(loc => loc.day === day);
                
                if (dayLocs.length === 0) return;

                // 插入該天的獨立標題區隔列 (Section Header)
                rows += `
                    <tr style="background-color: #334155; color: #ffffff; page-break-after: avoid;">
                        <td colspan="3" style="border: 1px solid #cbd5e1; padding: 12px; text-align: center; font-size: 16px; font-weight: bold; letter-spacing: 2px;">
                            ${dayNames[day]}
                        </td>
                    </tr>
                `;

                dayLocs.forEach((loc, index) => {
                    rows += `
                        <tr style="page-break-inside: avoid;">
                            <td style="border: 1px solid #cbd5e1; padding: 10px; text-align: center; vertical-align: middle; background-color: #f8fafc; font-weight: bold; color: #64748b; font-size: 16px;">
                                ${index + 1}
                            </td>
                            <td style="border: 1px solid #cbd5e1; padding: 10px; font-weight: bold; color: #0f172a; vertical-align: top; word-wrap: break-word;">
                                ${loc.name}
                            </td>
                            <td style="border: 1px solid #cbd5e1; padding: 10px; vertical-align: top; word-wrap: break-word;">
                                <div style="color: #475569; margin-bottom: 6px; line-height: 1.5;">${loc.desc}</div>
                                ${loc.address ? `<div style="font-size: 11px; color: #94a3b8;">📍 ${loc.address}</div>` : ''}
                            </td>
                        </tr>
                    `;
                });
            });
            
            return rows;
        }

        // 頁面載入完成後初始化
        document.addEventListener('DOMContentLoaded', initMap);

    </script>
</body>
</html>
